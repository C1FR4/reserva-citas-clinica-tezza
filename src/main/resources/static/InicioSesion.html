<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Inicio de Sesión | Clínica Tezza</title>

    <link rel="stylesheet" href="iniciosesion.css" />
  </head>

  <body>
    <main class="contenedor-login">
      <!-- INFORMACIÓN -->
      <section class="login-info">
        <div class="logo-login">CLÍNICA TEZZA</div>

        <div class="texto-login">
          <span> CLÍNICA PADRE LUIS TEZZA </span>

          <h1>
            Tu salud,
            <br />
            nuestra prioridad.
          </h1>

          <p>
            Accede a tu cuenta para gestionar tus citas médicas y consultar tu
            información.
          </p>
        </div>
      </section>

      <!-- FORMULARIO -->
      <section class="login-formulario">
        <form id="login-form">
          <h2>Bienvenido</h2>

          <p class="subtitulo">Paciente: correo registrado. Administrador: usuario asignado.</p>

          <label for="email"> Usuario o correo electrónico </label>

          <input type="text" id="email" name="email" placeholder="Ingresa tu usuario" autocomplete="username" required />

          <label for="password"> Contraseña </label>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Ingresa tu contraseña"
            required
          />

          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button type="submit">Iniciar sesión</button>
        </form>
      </section>
    </main>
    <script src="login.js" defer></script>
  </body>
</html>
