spring.application.name=clinica-tezza
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3308}/${DB_NAME:clinica_tezza_recordatorios}?useUnicode=true&characterEncoding=utf8
spring.datasource.username=${DB_USER:clinica_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=${PORT:8081}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=TEZZA_REGISTRO_SESSION

# Gmail: habilitar solo tras configurar una cuenta remitente y su clave de aplicación.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
clinica.correo.habilitado=${MAIL_ENABLED:false}
clinica.correo.remitente=${MAIL_FROM:${MAIL_USERNAME:}}
clinica.correo.intervalo-ms=${MAIL_INTERVAL_MS:30000}
spring.jackson.deserialization.fail-on-unknown-properties=true
